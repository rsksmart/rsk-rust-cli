[package]
name = "zk_methods"
version = "0.1.0"
edition = "2021"



[package.metadata.risc0]
methods = ["transfer", "vote"]

[[bin]]
name = "transfer"
path = "src/bin/transfer.rs"

[[bin]]
name = "vote"
path = "src/bin/vote.rs"

[dependencies]
risc0-zkvm = { version = "1.0", features = ["std"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }

