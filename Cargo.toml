[package]
name = "rsk-rust-cli"
version = "0.1.0"
edition = "2024"
default-run = "rootstock-wallet"

[features]
default = []
zk = ["dep:risc0-zkvm", "dep:bincode", "dep:zk-circuits", "dep:ark-bn254", "dep:ark-ec", "dep:ark-ff", "dep:sha2"]

[lib]
name = "rootstock_wallet"
path = "src/lib.rs"

[[bin]]
name = "rootstock-wallet"
path = "src/main.rs"

[[bin]]
name = "demo_voting"
path = "src/bin/demo_voting.rs"
required-features = ["zk"]

[dependencies]
hex = "0.4.3"
image = "0.25.6"
qrcode = "0.14.1"
serde = { version = "1.0.225", features = ["derive"] }
serde_json = { version = "1.0.145", default-features = false, features = ["alloc"] }
sha3 = "0.10.8"
tokio = { version = "1.45.1", features = ["full"] }
zeroize = "1.8.1"
risc0-zkvm = { version = "1.0", features = ["prove"], optional = true }
bincode = { version = "1.3", optional = true }
zk-circuits = { path = "./zk-circuits", optional = true }
# Host-side ElGamal encryption (BN254). Optional: only needed with --features zk.
# The guest circuit uses SHA-256 only; these crates run in native Rust (fast).
ark-bn254 = { version = "0.4.0", optional = true }
ark-ec = { version = "0.4.0", optional = true }
ark-ff = { version = "0.4.0", optional = true }
# SHA-256 for host-side Merkle leaf/node hashing (matches guest circuit algorithm).
sha2 = { version = "0.10", optional = true }


# Alloy dependencies - umbrella crate provides all sub-components via features
alloy = { version = "0.6.4", features = ["full", "provider-http", "signer-local", "contract", "rpc-types", "consensus", "json-abi", "sol-types"] }
thiserror = "2.0.12"
clap = { version = "4.5.36", features = ["derive"] }
k256 = "0.13.4"
env_logger = "0.11.8"
log = "0.4.28"
dotenvy = "0.15.7"
reqwest = { version = "0.12.15", features = ["json", "rustls-tls"] }
colored = "3.0.0"
tempfile = "3.20.0"
eth-keystore = "0.5.0"
rand = "0.8.5"
anyhow = "1.0.99"
chrono = { version = "0.4.41", features = ["serde"] }
prettytable-rs = "0.10.0"
dirs = "6.0.0"
toml = "0.9.7"
url = "2.5.7"
aes = "0.8.4"
aes-gcm = "0.10.3"
scrypt = "0.11.0"
base64 = "0.22.1"
rpassword = "7.4.0"
cbc = "0.1.2"
cipher = "0.4.4"
typenum = "1.18.0"
generic-array = "1.0"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
console = "0.15"
clearscreen = "4.0.2"
inquire = "0.9.1"
async-trait = "0.1.89"
csv = "1.3.1"

